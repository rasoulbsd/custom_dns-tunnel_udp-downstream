[package]
name = "dns-tunnel"
version = "0.2.0"
edition = "2021"
description = "Adaptive multi-transport DNS tunnel"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# DNS protocol
hickory-proto = "0.24"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
rand = "0.8"
log = "0.4"
env_logger = "0.11"
hex = "0.4"

# === New v2 dependencies ===

# HTTP client for DoH (optional, enable when implementing DoH)
# reqwest = { version = "0.12", features = ["rustls-tls"], optional = true }

# QUIC for DoQ (optional, enable when implementing DoQ)
# quinn = { version = "0.11", optional = true }
# rustls = { version = "0.23", optional = true }

# Embedded database (optional, enable for persistent resolver DB)
# redb = { version = "2.0", optional = true }

# FEC (optional, enable for Forward Error Correction)
# reed-solomon-erasure = { version = "6.0", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
# Enable DoH transport
doh = []
# Enable DoQ transport  
doq = []
# Enable persistent database
persistent = []
# Enable FEC
fec = []
# Enable all optional features
full = ["doh", "doq", "persistent", "fec"]
