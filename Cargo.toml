[package]
name = "dns-tunnel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
hickory-proto = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
hex = "0.4"

[dev-dependencies]
