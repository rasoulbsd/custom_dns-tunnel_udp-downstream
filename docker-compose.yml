version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: dns-tunnel-server
    image: dns-tunnel:server
    restart: unless-stopped
    network_mode: host  # Required for DNS port 53 and direct UDP communication
    # Alternative: use bridge network with port mapping (requires privileged mode)
    # networks:
    #   - tunnel-network
    # ports:
    #   - "53:53/udp"
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    volumes:
      - ./server-config.json:/app/config/server-config.json:ro
      - ./logs/server:/app/logs
    environment:
      - RUST_LOG=info
    # Run as root for port 53 (or use capabilities)
    privileged: true
    # Alternative: use specific capabilities instead of privileged
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    #   - NET_BIND_SERVICE
    # user: "0:0"  # root user

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: dns-tunnel-client
    image: dns-tunnel:client
    restart: unless-stopped
    network_mode: host  # Required for local UDP and DNS queries
    # Alternative: use bridge network
    # networks:
    #   - tunnel-network
    # ports:
    #   - "5355:5355/udp"
    volumes:
      - ./client-config.json:/app/config/client-config.json:ro
      - ./logs/client:/app/logs
    environment:
      - RUST_LOG=info
    depends_on:
      - server
    # Client doesn't need privileged mode

# Uncomment if using bridge network instead of host mode
# networks:
#   tunnel-network:
#     driver: bridge
